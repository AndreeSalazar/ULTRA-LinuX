# ULTRA LinuX: suspension con NVIDIA sin systemd (lo lee el init en C, hardware.c).
# El driver guarda la memoria de video en un archivo temporal antes de dormir y
# la recupera al despertar; sin esto Hyprland puede volver en negro o corrupto.
# La ruta se resuelve en la sesion (/arch), donde /juegos es ext4 con espacio.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/juegos/.ultra-nvidia
