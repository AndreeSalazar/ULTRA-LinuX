[package]
name = "ultra-carpetas"
default-run = "ultra-carpetas"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "GPL-2.0-only"
description = "Gestor de carpetas de BMO-X: iconos donde tu quieras, con control. Dibuja con wgpu (Vulkan en Linux)."
authors = ["Eddi Salazar"]

[dependencies]
carpetas-nucleo = { path = "../carpetas-nucleo" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
bytemuck = { version = "1", features = ["derive"] }
serde_json = "1"

# Solo en Linux: ventanas de Wayland/X11 y el vigia con inotify.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11"] }
inotify = { version = "0.9", default-features = false }

[profile.release]
lto = "thin"
strip = true
